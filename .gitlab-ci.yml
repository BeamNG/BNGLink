stages:
  - publish

publish_public:
  stage: publish
  image: ubuntu:latest
  tags:
    - docker
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git ca-certificates
  script:
    - bash packaging/publish.sh